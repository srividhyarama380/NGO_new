<template>
<lightning-card title="Select Donor City">
    <div class="slds-p-around_medium">
        <lightning-combobox
            label="Select City"
            value={selectedCity}
            options={cityOptions}
            onchange={handleCityChange}>
        </lightning-combobox>
        <template if:true={selectedCity}>
                <p class="slds-m-top_medium">
                    Selected City:
                    <b>{selectedCity}</b>
                </p>
        </template>
    </div>
 </lightning-card>

    <lightning-card title="Basic Lightning Map">

</template>
