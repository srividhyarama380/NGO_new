<template>
    <lightning-card title="Donor List" icon-name="standard:contact">

        <template if:true={donors}>
            <lightning-datatable
                key-field="Id"
                data={donors}
                columns={columns}>
            </lightning-datatable>
        </template>

        <template if:true={error}>
            <div class="slds-var-p-around_medium slds-text-color_error">
                An error occurred while loading donors.
            </div>
        </template>

    </lightning-card>
</template>
